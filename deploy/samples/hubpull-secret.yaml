apiVersion: sealhub.io/v1alpha1
kind: HubPull
metadata:
  name: demo-app
  namespace: default
spec:
  server: https://sealhub.example.com
  documentPath: secrets/default/demo-app.yaml
  watch: true
  refreshInterval: 2m
  auth:
    secretRef:
      name: sealhub-read-token
      key: token
  target:
    kind: Secret
    template: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: demo-app
      type: Opaque
      stringData:
        config: "{{ .document }}"
