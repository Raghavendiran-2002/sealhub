title: "Starry Cloud ✨"
subtitle: "Homelab on live"

# One reverse proxy in front (Cloudflare tunnel / cloudflared).
trusted_proxy_hops: 1

login_protection:
  login_max_attempts: 5
  login_window_seconds: 300
  login_lockout_seconds: 900

services:
  - name: "Pocket ID"
    url: "https://id.raghavendiran.cloud"
    icon_url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/pocket-id.png"
    description: "OIDC identity"

  - name: "Kubernetes (Headlamp)"
    url: "https://dashboard.raghavendiran.cloud"
    icon_url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/headlamp.png"
    description: "Cluster dashboard"

  - name: "Immich"
    url: "https://immich.raghavendiran.cloud"
    icon_url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/immich.png"
    description: "Photos"

  - name: "SealHub"
    url: "http://192.168.1.14:8080"
    icon_url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/git.png"
    description: "Config hub (LAN)"
