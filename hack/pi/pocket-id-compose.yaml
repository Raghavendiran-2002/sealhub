# Pocket ID only (Pi / homelab). cloudflared omitted — use tunnel on Mac or add separately.
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.14.0
    container_name: pocket-id
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      APP_URL: ${APP_URL:-https://id.raghavendiran.cloud}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DB_CONNECTION_STRING: "file:data/pocket-id.db?_journal_mode=DELETE"
    ports:
      - "1411:1411"
    volumes:
      - "./data:/app/data"
