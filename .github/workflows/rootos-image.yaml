name: RootOS Image

on:
  workflow_dispatch:
  push:
    branches:
      - rootos

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/raghavendiran-2002/rootos
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Raspberry Pi only (64-bit and 32-bit armhf). No amd64/other arches.
          platforms: linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed: ghcr.io/raghavendiran-2002/rootos:latest (linux/arm64 + linux/arm/v7)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: METRICS_TOKEN=... ./hack/pi/deploy-rootos-all.sh" >> "$GITHUB_STEP_SUMMARY"
