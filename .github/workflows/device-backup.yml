name: Device Backup (Pi live)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sealhub-device-backup
  cancel-in-progress: false

env:
  DEVICE_HOST: live
  PI_TAILSCALE_IP: 100.114.97.68
  DATA_REPO: Raghavendiran-2002/sealhub-data

jobs:
  backup:
    name: Backup Pi → sealhub-data (retain 3)
    runs-on: ubuntu-latest
    environment: tailscale

    steps:
      - name: Checkout sealhub (scripts)
        uses: actions/checkout@v4
        with:
          path: sealhub

      - name: Checkout sealhub-data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.SEALHUB_DATA_PUSH_TOKEN }}
          path: sealhub-data

      - name: Connect to Pi
        id: ts
        uses: ./sealhub/.github/actions/connect-tailscale-pi
        with:
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_audience: ${{ secrets.TS_AUDIENCE }}
          pi_tailscale_ip: ${{ env.PI_TAILSCALE_IP }}

      - name: Run device backup over SSH
        working-directory: sealhub
        env:
          SEALHUB_TOKEN: ${{ secrets.SEALHUB_PI_BACKUP_TOKEN }}
          SUDO_PASS: ${{ secrets.PI_SUDO_PASS }}
          DEVICE_BACKUP_ROOT: ${{ github.workspace }}/sealhub-data/device-live
          DEVICE_BACKUP_GIT_COMMIT: 0
        run: |
          set -euo pipefail
          chmod +x hack/pi/device-backup.sh hack/pi/prune-device-backups.sh
          export DEVICE_SSH="${{ steps.ts.outputs.ssh_target }}"
          export DEVICE_SSH_FALLBACK="${{ env.PI_TAILSCALE_IP }}"
          export PI_TAILSCALE_IP="${{ env.PI_TAILSCALE_IP }}"
          export LIVE_PASS="$SUDO_PASS"
          bash hack/pi/device-backup.sh

      - name: Commit and push sealhub-data (max 3 snapshots)
        working-directory: sealhub-data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add device-live/
          if git diff --staged --quiet; then
            echo "No backup changes"
            exit 0
          fi
          SNAP="$(python3 -c "import json; print(json.load(open('device-live/manifest.json'))['snapshots'][0]['id'])")"
          git commit -m "chore(backup): device-live ${SNAP}"
          git push
