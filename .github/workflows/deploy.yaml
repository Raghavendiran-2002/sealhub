name: SealHub Deploy Pi

# Tailscale WIF: environment tailscale → Trust credential Subject must include environment:tailscale
# See docs/TAILSCALE-OIDC-CI.md (Subject example:
#   repo:Raghavendiran-2002@70228368/sealhub@1382946894:environment:tailscale)

on:
  # workflow_run:
  #   workflows: ["SealHub Image Build"]
  #   types: [completed]
  #   branches: [main, master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "hubd tag suffix (e.g. 0.1-latest or 0.1.42). Default 0.1-latest"
        required: false
        default: "0.1-latest"

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: sealhub-deploy-pi
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/raghavendiran-2002/sealhub/hubd
  PI_SSH: pi@live
  PI_TAILSCALE_IP: 100.72.63.104

jobs:
  deploy:
    name: Deploy hubd to Pi (live)
    runs-on: ubuntu-latest
    environment: tailscale

    steps:
      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="0.1-latest"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY_IMAGE }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Tailscale WIF secrets
        shell: bash
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUD: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -euo pipefail
          if [[ -z "$TS_ID" || -z "$TS_AUD" ]]; then
            echo "::error::Missing TS_OAUTH_CLIENT_ID or TS_AUDIENCE on environment tailscale."
            exit 1
          fi
          if [[ "$TS_AUD" != api.tailscale.com/* ]]; then
            echo "::error::TS_AUDIENCE must be the Trust credential Audience (api.tailscale.com/…), not an auth key or OAuth client secret."
            exit 1
          fi
          if [[ "$TS_ID" == api.tailscale.com/* ]]; then
            echo "::error::TS_OAUTH_CLIENT_ID must be the Trust credential Client ID, not the Audience."
            exit 1
          fi

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Resolve Pi SSH target
        id: pi
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 15); do
            for target in "${{ env.PI_SSH }}" "pi@${{ env.PI_TAILSCALE_IP }}"; do
              if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "$target" true 2>/dev/null; then
                echo "target=$target" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 4
          done
          echo "Tailscale SSH to Pi failed — ACL ssh accept tag:ci→tag:homelab user pi; tailscale set --ssh on live" >&2
          exit 1

      - name: Install deploy script on Pi
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ steps.pi.outputs.target }}" \
            'cat > /tmp/deploy-hubd-ci.sh && chmod +x /tmp/deploy-hubd-ci.sh' \
            < hack/pi/deploy-hubd-ci.sh

      - name: Deploy on Pi
        env:
          HUBD_IMAGE: ${{ steps.tag.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          SUDO_PASS: ${{ secrets.PI_SUDO_PASS }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ steps.pi.outputs.target }}" \
            "HUBD_IMAGE='${HUBD_IMAGE}' GHCR_TOKEN='${GHCR_TOKEN:-}' GHCR_USER='raghavendiran-2002' \
             SUDO_PASS='${SUDO_PASS:-}' /tmp/deploy-hubd-ci.sh"

      - name: Smoke check
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "${{ steps.pi.outputs.target }}" \
            "curl -sf http://127.0.0.1:8080/healthz && echo && curl -sf http://127.0.0.1:8080/readyz && echo"
