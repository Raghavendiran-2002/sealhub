name: SealHub Image Build

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push
        uses: docker/bake-action@v6
        with:
          files: ./docker-argo-bake.hcl
          push: true
          set: |
            *.variables.GITHUB_RUN_NUMBER=${{ github.run_number }}
            *.variables.IMAGE_PREFIX=ghcr.io/raghavendiran-2002/sealhub
