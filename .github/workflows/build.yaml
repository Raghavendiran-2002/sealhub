name: SealHub Image Build

# Push trigger disabled while testing deploy-only; re-enable push when CI is stable.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push
        uses: docker/bake-action@v6
        with:
          files: ./docker-argo-bake.hcl
          push: true
          set: |
            hubd.tags=ghcr.io/raghavendiran-2002/sealhub/hubd:0.1.${{ github.run_number }}
            hubd.tags=ghcr.io/raghavendiran-2002/sealhub/hubd:0.1-latest
            operator.tags=ghcr.io/raghavendiran-2002/sealhub/operator:0.1.${{ github.run_number }}
            operator.tags=ghcr.io/raghavendiran-2002/sealhub/operator:0.1-latest
